// ⚠️ 智谱 API Key
const ZHIPU_API_KEY = '5d7e3c5b8fab407f82041ae71afa5be5.b2Jk2NSF5s7kWlHf';
const ZHIPU_URL = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
const ZHIPU_MODEL = 'glm-4-flash';
const LLM_TIMEOUT = 20000;

async function callLLM(messages, temperature = 0.7) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), LLM_TIMEOUT);
  try {
    const res = await fetch(ZHIPU_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ZHIPU_API_KEY}` },
      body: JSON.stringify({ model: ZHIPU_MODEL, messages, temperature }),
      signal: controller.signal,
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error(`API 错误 ${res.status}: ${t.slice(0, 200)}`);
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '';
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('请求超时，请重试');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

const THEME_KEYWORDS = { 红:'red', 蓝:'blue', 紫:'purple', 绿:'green', 橙:'orange', 粉:'pink' };

function tryLocalRule(input, hasApp) {
  const text = input.trim();
  // 主题切换
  if (hasApp && /主题|颜色|换|改成/.test(text)) {
    for (const k in THEME_KEYWORDS) {
      if (text.includes(k)) {
        return { action: 'updateTheme', config: { theme: THEME_KEYWORDS[k] },
          replySteps: [`已切换为${k}色主题。`] };
      }
    }
  }
  // 加功能
  if (hasApp && /加|添加|增加/.test(text) && /导出/.test(text)) {
    return { action: 'toggleFeature', config: { feature: 'export' },
      replySteps: ['已添加导出功能。'] };
  }
  // 创建应用
  for (const rule of LOCAL_RULES) {
    if (rule.match.test(text)) {
      const r = { ...rule.result };
      // 主题色覆盖
      for (const k in THEME_KEYWORDS) {
        if (text.includes(k)) { r.config = { ...r.config, theme: THEME_KEYWORDS[k] }; break; }
      }
      return r;
    }
  }
  return null;
}

// ============ 智能体：LLM 解析（仅自由输入时调用） ============
async function parseIntentWithLLM(userInput, currentApp) {
  const sys = `你是应用生成智能体。用户用自然语言描述想要的应用，你判断意图并输出严格 JSON。

可选模板：
- AIWriter: AI 写作助手
- AICoder: AI 代码助手
- ChatAssistant: AI 问答助手

主题色：blue, purple, green, red, orange, pink

只输出 JSON：

创建：
{"action":"create","template":"AIWriter","name":"AI 写作助手","config":{"theme":"purple","welcome":"输入主题"},"replySteps":["步骤1","步骤2"]}

改主题：
{"action":"updateTheme","config":{"theme":"red"},"replySteps":["已切换"]}

加功能：
{"action":"toggleFeature","config":{"feature":"export"},"replySteps":["已添加"]}

无法理解：
{"action":"unknown","replySteps":["提示"]}

当前有激活应用：${currentApp ? '是，' + currentApp.name : '否'}`;

  const reply = await callLLM([
    { role: 'system', content: sys },
    { role: 'user', content: userInput },
  ], 0.3);

  let txt = reply.trim();
  const m = txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (m) txt = m[1].trim();
  const s = txt.indexOf('{'), e = txt.lastIndexOf('}');
  if (s >= 0 && e > s) txt = txt.slice(s, e + 1);
  return JSON.parse(txt);
}

// ============ IndexedDB ============
const DB_NAME = 'AtomsDemoDB';
let dbReady = null;
function openDB() {
  if (dbReady) return dbReady;
  dbReady = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('apps')) d.createObjectStore('apps', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('messages')) d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('appData')) d.createObjectStore('appData', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbReady;
}
async function idbAdd(s, data) { const d = await openDB(); return new Promise((res, rej) => { const tx = d.transaction(s, 'readwrite'); const r = tx.objectStore(s).add(data); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGetAll(s, filter) { const d = await openDB(); return new Promise((res, rej) => { const tx = d.transaction(s, 'readonly'); const r = tx.objectStore(s).getAll(); r.onsuccess = () => { let rows = r.result || []; if (filter) rows = rows.filter(row => Object.entries(filter).every(([k, v]) => row[k] === v)); res(rows); }; r.onerror = () => rej(r.error); }); }
async function idbGet(s, id) { const d = await openDB(); return new Promise((res, rej) => { const tx = d.transaction(s, 'readonly'); const r = tx.objectStore(s).get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(s, data) { const d = await openDB(); return new Promise((res, rej) => { const tx = d.transaction(s, 'readwrite'); const r = tx.objectStore(s).put(data); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbDelete(s, id) { const d = await openDB(); return new Promise((res, rej) => { const tx = d.transaction(s, 'readwrite'); const r = tx.objectStore(s).delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
async function idbDeleteWhere(s, filter) { const rows = await idbGetAll(s, filter); for (const row of rows) await idbDelete(s, row.id); }

const db = {
  apps: {
    add: d => idbAdd('apps', d),
    get: id => idbGet('apps', id),
    update: async (id, patch) => { const cur = await idbGet('apps', id); if (!cur) return; await idbPut('apps', { ...cur, ...patch }); },
    delete: id => idbDelete('apps', id),
    all: async () => (await idbGetAll('apps')).sort((a, b) => b.createdAt - a.createdAt),
  },
  messages: {
    add: d => idbAdd('messages', d),
    where: filter => ({ sortBy: async f => (await idbGetAll('messages', filter)).sort((a, b) => (a[f]||0) - (b[f]||0)) }),
    deleteWhere: filter => idbDeleteWhere('messages', filter),
  },
  appData: {
    add: d => idbAdd('appData', d),
    where: filter => ({
      sortBy: async f => (await idbGetAll('appData', filter)).sort((a, b) => (a[f]||0) - (b[f]||0)),
      reverse: () => ({ sortBy: async f => (await idbGetAll('appData', filter)).sort((a, b) => (b[f]||0) - (a[f]||0)) }),
      delete: () => idbDeleteWhere('appData', filter),
    }),
  },
};

function useLiveQuery(queryFn, deps = []) {
  const [data, setData] = useState(undefined);
  useEffect(() => {
    let alive = true;
    const refresh = () => { Promise.resolve(queryFn()).then(d => { if (alive) setData(d); }); };
    refresh();
    const iv = setInterval(refresh, 500);
    return () => { alive = false; clearInterval(iv); };
  }, deps);
  return data;
}

const nanoid = () => Math.random().toString(36).slice(2, 10);

const THEME_BG = { blue:'bg-blue-50', purple:'bg-purple-50', green:'bg-green-50', red:'bg-red-50', orange:'bg-orange-50', pink:'bg-pink-50' };
const THEME_BTN = { blue:'bg-blue-500', purple:'bg-purple-500', green:'bg-green-500', red:'bg-red-500', orange:'bg-orange-500', pink:'bg-pink-500' };

// ============ 模板：AI 写作助手 ============
function AIWriter({ appId, config }) {
  const [topic, setTopic] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const theme = config?.theme || 'purple';
  const features = config?.features || [];

  useEffect(() => { db.appData.where({ appId, type:'article' }).reverse().sortBy('createdAt').then(setResults); }, [appId]);

  const generate = async () => {
    if (!topic.trim() || loading) return;
    setLoading(true); setError('');
    const t = topic;
    try {
      const text = await callLLM([
        { role:'system', content:'你是专业写作助手。根据主题写一篇结构清晰的文章，用 Markdown 格式。' },
        { role:'user', content:`请写一篇关于「${t}」的文章` },
      ]);
      const article = { id: nanoid(), appId, type:'article', content: { topic: t, text }, createdAt: Date.now() };
      await db.appData.add(article);
      setResults(p => [article, ...p]);
      setTopic('');
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  const exportAll = () => {
    const text = results.map(r => r.content.text).join('\n\n---\n\n');
    const blob = new Blob([text], { type:'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'articles.md'; a.click();
  };

  return (
    <div className="h-full flex flex-col bg-white">
      <div className="flex items-center justify-between px-4 py-2 border-b">
        <span className="font-medium">AI 写作助手</span>
        {features.includes('export') && <button onClick={exportAll} className="p-1.5 rounded hover:bg-gray-100">⬇ 导出</button>}
      </div>
      <div className="p-4 border-b flex gap-2">
        <input value={topic} onChange={e=>setTopic(e.target.value)} onKeyDown={e=>e.key==='Enter'&&generate()}
          className="flex-1 border rounded-lg px-3 py-2 text-sm outline-none" placeholder="输入写作主题，如：人工智能的未来" />
        <button onClick={generate} disabled={loading}
          className={`px-4 py-2 text-white rounded-lg text-sm ${THEME_BTN[theme]||'bg-purple-500'} disabled:opacity-50`}>
          {loading ? '生成中...' : '生成'}
        </button>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-4">
        {error && <div className="text-sm text-red-500 p-2 bg-red-50 rounded">{error}</div>}
        {results.length === 0 && !loading && !error && <div className="text-center text-gray-400 mt-8 text-sm">输入主题，AI 会为你生成文章</div>}
        {loading && <div className="text-center text-gray-400 text-sm">AI 正在写作...</div>}
        {results.map(r => (
          <div key={r.id} className="p-4 bg-gray-50 rounded-lg border">
            <div className="text-xs text-gray-500 mb-2">主题：{r.content.topic}</div>
            <pre className="whitespace-pre-wrap text-sm font-sans">{r.content.text}</pre>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============ 模板：AI 代码助手 ============
function AICoder({ appId, config }) {
  const [requirement, setRequirement] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const theme = config?.theme || 'blue';
  const features = config?.features || [];

  useEffect(() => { db.appData.where({ appId, type:'code' }).reverse().sortBy('createdAt').then(setResults); }, [appId]);

  const generate = async () => {
    if (!requirement.trim() || loading) return;
    setLoading(true); setError('');
    const r = requirement;
    try {
      const text = await callLLM([
        { role:'system', content:'你是资深程序员。根据需求生成代码，用 markdown 代码块包裹，并简要说明。' },
        { role:'user', content: r },
      ]);
      const item = { id: nanoid(), appId, type:'code', content: { requirement: r, text }, createdAt: Date.now() };
      await db.appData.add(item);
      setResults(p => [item, ...p]);
      setRequirement('');
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  const exportAll = () => {
    const text = results.map(r => `需求：${r.content.requirement}\n\n${r.content.text}`).join('\n\n=====\n\n');
    const blob = new Blob([text], { type:'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'codes.md'; a.click();
  };

  return (
    <div className="h-full flex flex-col bg-white">
      <div className="flex items-center justify-between px-4 py-2 border-b">
        <span className="font-medium">AI 代码助手</span>
        {features.includes('export') && <button onClick={exportAll} className="p-1.5 rounded hover:bg-gray-100">⬇ 导出</button>}
      </div>
      <div className="p-4 border-b flex gap-2">
        <input value={requirement} onChange={e=>setRequirement(e.target.value)} onKeyDown={e=>e.key==='Enter'&&generate()}
          className="flex-1 border rounded-lg px-3 py-2 text-sm outline-none" placeholder="如：写一个 Dockerfile 部署 Node.js 应用" />
        <button onClick={generate} disabled={loading}
          className={`px-4 py-2 text-white rounded-lg text-sm ${THEME_BTN[theme]||'bg-blue-500'} disabled:opacity-50`}>
          {loading ? '生成中...' : '生成'}
        </button>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-4">
        {error && <div className="text-sm text-red-500 p-2 bg-red-50 rounded">{error}</div>}
        {results.length === 0 && !loading && !error && <div className="text-center text-gray-400 mt-8 text-sm">描述你的编程需求，AI 会为你生成代码</div>}
        {loading && <div className="text-center text-gray-400 text-sm">AI 正在编写代码...</div>}
        {results.map(r => (
          <div key={r.id} className="p-4 bg-gray-50 rounded-lg border">
            <div className="text-xs text-gray-500 mb-2">需求：{r.content.requirement}</div>
            <pre className="whitespace-pre-wrap text-xs font-mono bg-white p-3 rounded border">{r.content.text}</pre>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============ 模板：AI 问答助手 ============
function ChatAssistant({ appId, config }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const theme = config?.theme || 'blue';
  const bottomRef = useRef(null);

  useEffect(() => { db.appData.where({ appId, type:'message' }).sortBy('createdAt').then(setMessages); }, [appId]);
  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages, loading]);

  const send = async () => {
    if (!input.trim() || loading) return;
    const text = input.trim();
    setInput(''); setError('');
    const userMsg = { id: nanoid(), appId, type:'message', content: { role:'user', text }, createdAt: Date.now() };
    await db.appData.add(userMsg);
    setMessages(p => [...p, userMsg]);
    setLoading(true);
    try {
      const history = [...messages, userMsg].map(m => ({ role: m.content.role, content: m.content.text }));
      const reply = await callLLM([{ role:'system', content:'你是一个乐于助人的 AI 助手。' }, ...history]);
      const aiMsg = { id: nanoid(), appId, type:'message', content: { role:'assistant', text: reply }, createdAt: Date.now() };
      await db.appData.add(aiMsg);
      setMessages(p => [...p, aiMsg]);
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  const clear = async () => { await db.appData.where({ appId, type:'message' }).delete(); setMessages([]); };

  return (
    <div className={`h-full flex flex-col ${THEME_BG[theme]||''}`}>
      <div className="flex items-center justify-between px-4 py-2 bg-white border-b">
        <span className="font-medium">AI 问答助手</span>
        <button onClick={clear} className="p-1.5 rounded hover:bg-gray-100">🗑</button>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-3">
        {messages.length === 0 && <div className="text-center text-gray-400 mt-8 text-sm">{config?.welcome || '开始对话吧'}</div>}
        {messages.map(m => (
          <div key={m.id} className={m.content.role==='user' ? 'text-right' : 'text-left'}>
            <div className={`inline-block px-3 py-2 rounded-lg max-w-[80%] text-sm whitespace-pre-wrap ${
              m.content.role==='user' ? `${THEME_BTN[theme]||'bg-blue-500'} text-white` : 'bg-white shadow'
            }`}>{m.content.text}</div>
          </div>
        ))}
        {loading && <div className="text-xs text-gray-400">AI 思考中...</div>}
        {error && <div className="text-xs text-red-500">{error}</div>}
        <div ref={bottomRef} />
      </div>
      <div className="p-3 border-t bg-white flex gap-2">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          className="flex-1 border rounded-lg px-3 py-2 text-sm outline-none" placeholder="输入消息..." />
        <button onClick={send} disabled={loading}
          className={`px-4 py-2 text-white rounded-lg text-sm ${THEME_BTN[theme]||'bg-blue-500'} disabled:opacity-50`}>发送</button>
      </div>
    </div>
  );
}

// ============ 对话面板 ============
function ChatPanel({ activeAppId, activeApp, onCreateApp, onUpdateApp }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [hint, setHint] = useState('');
  const bottomRef = useRef(null);

  useEffect(() => {
    const q = activeAppId ? { appId: activeAppId } : { appId: null };
    db.messages.where(q).sortBy('createdAt').then(setMessages);
  }, [activeAppId]);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  const pushMessage = async (role, content) => {
    const msg = { appId: activeAppId ?? null, role, content, createdAt: Date.now() };
    await db.messages.add(msg);
    setMessages(p => [...p, msg]);
  };

  const applyResult = async (result) => {
    const steps = result.replySteps || ['处理中...'];
    for (const step of steps) await pushMessage('assistant', step);

    if (result.action === 'create' && result.template && result.config) {
      await onCreateApp(result.template, result.config, result.name || '未命名应用');
    } else if (result.action === 'updateTheme' && activeAppId) {
      await onUpdateApp(activeAppId, { config: { theme: result.config.theme } });
    } else if (result.action === 'toggleFeature' && activeAppId) {
      const app = await db.apps.get(activeAppId);
      if (app) {
        const features = new Set(app.config.features || []);
        features.add(result.config.feature);
        await onUpdateApp(activeAppId, { config: { ...app.config, features: Array.from(features) } });
      }
    }
  };

  const send = async () => {
    if (!input.trim() || busy) return;
    const text = input; setInput(''); setBusy(true); setHint('');
    await pushMessage('user', text);

    // 1. 先试本地规则
    const localResult = tryLocalRule(text, !!activeAppId);
    if (localResult) {
      await applyResult(localResult);
      setBusy(false);
      return;
    }

    // 2. 本地规则不命中，调 LLM
    setHint('智能体思考中（约 3-8 秒）...');
    const started = Date.now();
    try {
      const result = await parseIntentWithLLM(text, activeApp);
      const elapsed = ((Date.now() - started) / 1000).toFixed(1);
      setHint(`智能体用了 ${elapsed} 秒`);
      await applyResult(result);
    } catch (e) {
      await pushMessage('assistant', `出错了：${e.message}`);
    } finally {
      setBusy(false);
      setTimeout(() => setHint(''), 2000);
    }
  };

  return (
    <div className="h-full flex flex-col bg-white border-r">
      <div className="px-4 py-3 border-b font-semibold text-gray-800">Atoms 工作区</div>
      <div className="flex-1 overflow-y-auto p-4 space-y-3">
        {messages.length === 0 && (
          <div className="text-sm text-gray-500 space-y-2">
            <p className="font-medium text-gray-700">👋 试试这样描述你的应用：</p>
            {['做一个 AI 写作助手','做一个 AI 代码助手','做一个 AI 问答助手','做一个红色主题的 AI 写作助手'].map(t => (
              <button key={t} onClick={()=>setInput(t)}
                className="block text-left px-3 py-2 bg-gray-50 rounded hover:bg-gray-100 w-full">{t}</button>
            ))}
          </div>
        )}
        {messages.map((m, i) => (
          <div key={i} className={m.role === 'user' ? 'text-right' : ''}>
            <div className={`inline-block px-3 py-2 rounded-lg max-w-[85%] text-sm whitespace-pre-wrap ${
              m.role === 'user' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-800'
            }`}>{m.content}</div>
          </div>
        ))}
        {busy && <div className="text-xs text-gray-400">{hint || '处理中...'}</div>}
        <div ref={bottomRef} />
      </div>
      <div className="p-3 border-t flex gap-2">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          className="flex-1 border rounded-lg px-3 py-2 text-sm outline-none" placeholder="描述你想要的应用..." />
        <button onClick={send} disabled={busy}
          className="px-3 py-2 bg-blue-500 text-white rounded-lg disabled:opacity-50">➤</button>
      </div>
    </div>
  );
}

// ============ 预览面板 ============
function PreviewPanel({ app }) {
  if (!app) return (
    <div className="h-full flex items-center justify-center bg-gray-50 text-gray-400 text-sm">
      <div className="text-center">左侧描述你的应用，这里会实时预览</div>
    </div>
  );
  const Comp = app.template === 'ChatAssistant' ? ChatAssistant
    : app.template === 'AIWriter' ? AIWriter
    : app.template === 'AICoder' ? AICoder : AIWriter;
  return (
    <div className="h-full flex flex-col">
      <div className="px-4 py-2 border-b bg-white flex items-center justify-between text-sm">
        <div className="flex items-center gap-2">
          <div className="flex gap-1">
            <span className="w-2.5 h-2.5 rounded-full bg-red-400" />
            <span className="w-2.5 h-2.5 rounded-full bg-yellow-400" />
            <span className="w-2.5 h-2.5 rounded-full bg-green-400" />
          </div>
          <span className="text-gray-600 ml-2">{app.name}</span>
        </div>
      </div>
      <div className="flex-1 overflow-hidden"><Comp appId={app.id} config={app.config} /></div>
    </div>
  );
}

// ============ 应用侧栏 ============
function AppSidebar({ activeAppId, onSelect, onDelete }) {
  const apps = useLiveQuery(() => db.apps.all(), []) || [];
  return (
    <div className="w-56 bg-gray-50 border-r flex flex-col">
      <div className="px-3 py-3 text-xs font-semibold text-gray-500 uppercase">我的应用</div>
      <div className="flex-1 overflow-y-auto px-2 space-y-1">
        {apps.length === 0 && <div className="text-xs text-gray-400 px-2 py-4">还没有应用</div>}
        {apps.map(app => (
          <div key={app.id}
            className={`group flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer text-sm ${
              activeAppId === app.id ? 'bg-blue-100 text-blue-700' : 'hover:bg-gray-100 text-gray-700'
            }`} onClick={()=>onSelect(app.id)}>
            <span className="truncate">{app.name}</span>
            <button onClick={e=>{e.stopPropagation(); onDelete(app.id);}}
              className="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500">✕</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============ 工作区主编排 ============
function Workspace() {
  const [activeAppId, setActiveAppId] = useState(null);
  const activeApp = useLiveQuery(() => activeAppId ? db.apps.get(activeAppId) : Promise.resolve(null), [activeAppId]);

  const createApp = async (template, config, name) => {
    const id = await db.apps.add({ name, template, config, createdAt: Date.now() });
    setActiveAppId(id);
    return id;
  };

  const updateApp = async (id, patch) => {
    const app = await db.apps.get(id);
    if (!app) return;
    await db.apps.update(id, { config: { ...app.config, ...patch.config } });
  };

  const deleteApp = async (id) => {
    await db.apps.delete(id);
    await db.appData.where({ appId: id }).delete();
    await db.messages.deleteWhere({ appId: id });
    if (activeAppId === id) setActiveAppId(null);
  };

  return (
    <div className="h-screen flex bg-white">
      <AppSidebar activeAppId={activeAppId} onSelect={setActiveAppId} onDelete={deleteApp} />
      <div className="w-96 flex-shrink-0">
        <ChatPanel activeAppId={activeAppId} activeApp={activeApp}
          onCreateApp={createApp} onUpdateApp={updateApp} />
      </div>
      <div className="flex-1">
        <PreviewPanel app={activeApp} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Workspace />);
</script>
</body>
</html>
