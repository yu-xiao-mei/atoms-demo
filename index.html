<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atoms Demo - AI 应用生成工作区</title>
  <!--
    部署说明：
    1. 在 https://open.bigmodel.cn/ 注册并创建 API Key
    2. 把 Key 填入下方脚本顶部的 ZHIPU_API_KEY 常量

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;background:#fff}

    input,textarea{font:inherit;border:none}

    .h-screen{height:100vh}.h-full{height:100%}.w-56{width:14rem}.w-96{width:24rem}.w-full{width:100%}
    .flex-shrink-0{flex-shrink:0}.overflow-hidden{overflow:hidden}.overflow-y-auto{overflow-y:auto}
    .items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
    .justify-end{justify-content:flex-end}.relative{position:relative}
    .border{border:1px solid #e5e7eb}.border-r{border-right:1px solid #e5e7eb}.border-b{border-bottom:1px solid #e5e7eb}.border-t{border-top:1px solid #e5e7eb}
    .rounded{border-radius:.375rem}.rounded-lg{border-radius:.6rem}.rounded-full{border-radius:9999px}

    .gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-4{gap:1rem}.ml-2{margin-left:.5rem}.mt-8{margin-top:2rem}.mb-2{margin-bottom:.5rem}
    .text-xs{font-size:.75rem}.text-sm{font-size:.875rem;line-height:1.5}.text-lg{font-size:1.1rem}
    .text-center{text-align:center}.text-right{text-align:right}.text-left{text-align:left}
    .font-medium{font-weight:500}.font-semibold{font-weight:600}.uppercase{text-transform:uppercase;letter-spacing:.06em}
    .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.whitespace-pre-wrap{white-space:pre-wrap;word-break:break-word}
    .font-sans{font-family:inherit}.font-mono{font-family:"SFMono-Regular",Consolas,Menlo,monospace}
    .bg-white{background:#fff}.bg-gray-50{background:#f9fafb}.bg-gray-100{background:#f3f4f6}.bg-gray-900{background:#111827}
    .bg-blue-50{background:#eff6ff}.bg-blue-100{background:#dbeafe}.bg-blue-500{background:#3b82f6}
    .bg-purple-50{background:#faf5ff}.bg-purple-100{background:#f3e8ff}.bg-purple-500{background:#a855f7}
    .bg-green-50{background:#f0fdf4}.bg-green-100{background:#dcfce7}.bg-green-500{background:#22c55e}
    .bg-red-50{background:#fef2f2}.bg-red-100{background:#fee2e2}.bg-red-500{background:#ef4444}
    .bg-orange-50{background:#fff7ed}.bg-orange-100{background:#ffedd5}.bg-orange-500{background:#f97316}
    .bg-pink-50{background:#fdf2f8}.bg-pink-100{background:#fce7f3}.bg-pink-500{background:#ec4899}
    .text-white{color:#fff}.text-gray-100{color:#f3f4f6}.text-gray-400{color:#9ca3af}.text-gray-500{color:#6b7280}.text-gray-600{color:#4b5563}
    .text-gray-700{color:#374151}.text-gray-800{color:#1f2937}.text-blue-700{color:#1d4ed8}.text-red-500{color:#ef4444}

    .group:hover .group-hover\:opacity-100{opacity:1}

    .max-w-\[85\%\]{max-width:85%}.max-w-\[80\%\]{max-width:80%}

    button:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}

<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ===== 1. LLM 封装 =====
    // 👇👇👇 在这里替换为你自己的智谱 API Key 👇👇👇
    const ZHIPU_API_KEY = '你的Key';
    const ZHIPU_URL = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
    const ZHIPU_MODEL = 'glm-4-flash';
    const LLM_TIMEOUT = 20000;

    async function callLLM(messages, temperature = 0.7) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), LLM_TIMEOUT);
      try {
        const res = await fetch(ZHIPU_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ZHIPU_API_KEY}` },
          body: JSON.stringify({ model: ZHIPU_MODEL, messages, temperature }),
          signal: controller.signal,
        });
        if (!res.ok) {
          const t = await res.text();
          throw new Error(`API 错误 ${res.status}: ${t.slice(0, 200)}`);
        }
        const data = await res.json();
        return data.choices?.[0]?.message?.content || '';
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('请求超时，请重试');
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    // ===== 2. 本地规则（预设秒回）=====
    const LOCAL_RULES = [
      { match: /写作|文章|文案/,
        result: { action: 'create', template: 'AIWriter', name: 'AI 写作助手',
          config: { theme: 'purple', welcome: '输入主题，AI 会为你生成文章' },
          replySteps: ['我理解你想做一个 AI 写作助手。', '生成：主题输入框、生成按钮、文章展示区。', '应用已生成，右侧可预览。'] } },
      { match: /代码|dockerfile|docker|脚本/i,
        result: { action: 'create', template: 'AICoder', name: 'AI 代码助手',
          config: { theme: 'blue', welcome: '描述你的需求，例如：写一个 Node 应用的 Dockerfile' },
          replySteps: ['我理解你想做一个 AI 代码助手。', '生成：需求输入框、生成按钮、代码展示区。', '应用已生成，右侧可预览。'] } },
      { match: /问答|对话|聊天|助手/,
        result: { action: 'create', template: 'ChatAssistant', name: 'AI 问答助手',
          config: { theme: 'green', welcome: '你好！有什么可以帮你？' },
          replySteps: ['我理解你想做一个 AI 问答助手。', '生成：多轮对话消息列表、输入框、清空按钮。', '应用已生成，右侧可预览。'] } },
    ];
    const THEME_KEYWORDS = { 红: 'red', 蓝: 'blue', 紫: 'purple', 绿: 'green', 橙: 'orange', 粉: 'pink' };

    function tryLocalRule(input, hasApp) {
      const text = input.trim();
      if (hasApp && /主题|颜色|换|改成/.test(text)) {
        for (const k in THEME_KEYWORDS) {
          if (text.includes(k)) return { action: 'updateTheme', config: { theme: THEME_KEYWORDS[k] }, replySteps: [`已切换为${k}色主题。`] };
        }
      }
      if (hasApp && /加|添加|增加/.test(text) && /导出/.test(text)) {
        return { action: 'toggleFeature', config: { feature: 'export' }, replySteps: ['已添加导出功能。'] };
      }
      // 自由描述（如「管理读书笔记」）不走本地规则，交给 LLM
      if (/^(做|帮我做|创建|生成)?一个\s*AI\s*(写作|代码|问答)助手$/i.test(text) || text.length <= 12) {
        for (const rule of LOCAL_RULES) {
          if (rule.match.test(text)) {
            const r = { ...rule.result, config: { ...rule.result.config } };
            for (const k in THEME_KEYWORDS) {
              if (text.includes(k)) { r.config.theme = THEME_KEYWORDS[k]; break; }
            }
            return r;
          }
        }
      }
      return null;
    }

    // ===== 3. IndexedDB 封装 =====
    const DB_NAME = 'AtomsDemoDB_v2';
    const STORES = ['apps', 'messages', 'appData'];
    let dbPromise = null;
    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          STORES.forEach((s) => {
            if (!d.objectStoreNames.contains(s)) {
              const os = d.createObjectStore(s, { keyPath: 'id', autoIncrement: true });
              os.createIndex('createdAt', 'createdAt');
              if (s !== 'apps') os.createIndex('appId', 'appId');
            }
          });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }
    async function tx(store, mode, fn) {
      const d = await openDB();
      return new Promise((resolve, reject) => {
        const t = d.transaction(store, mode);
        const r = fn(t.objectStore(store));
        t.oncomplete = () => resolve(r && 'result' in r ? r.result : undefined);
        t.onerror = () => reject(t.error);
      });
    }
    const idbAdd = (s, data) => tx(s, 'readwrite', (os) => os.add({ ...data, createdAt: data.createdAt || Date.now() }));
    const idbGetAll = (s) => tx(s, 'readonly', (os) => os.getAll());
    const idbGet = (s, id) => tx(s, 'readonly', (os) => os.get(id));
    const idbPut = (s, data) => tx(s, 'readwrite', (os) => os.put(data));
    const idbDelete = (s, id) => tx(s, 'readwrite', (os) => os.delete(id));
    const matches = (row, filter) => Object.keys(filter).every((k) => (row[k] ?? null) === (filter[k] ?? null));
    async function idbDeleteWhere(s, filter) {
      const rows = (await idbGetAll(s)).filter((r) => matches(r, filter));
      if (!rows.length) return;
      await tx(s, 'readwrite', (os) => { rows.forEach((r) => os.delete(r.id)); });
    }

    // ===== 4. db 对象（类 Dexie API）=====
    function makeTable(s) {
      const where = (filter) => {
        const query = (rev) => ({
          sortBy: async (key) => {
            const rows = (await idbGetAll(s)).filter((r) => matches(r, filter));
            rows.sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : a.id - b.id));
            return rev ? rows.reverse() : rows;
          },
        });
        return { ...query(false), reverse: () => query(true), delete: () => idbDeleteWhere(s, filter) };
      };
      return {
        add: (data) => idbAdd(s, data),
        get: (id) => idbGet(s, id),
        update: async (id, patch) => { const r = await idbGet(s, id); if (r) await idbPut(s, { ...r, ...patch }); },
        delete: (id) => idbDelete(s, id),
        all: async () => (await idbGetAll(s)).sort((a, b) => b.createdAt - a.createdAt),
        where,
        deleteWhere: (filter) => idbDeleteWhere(s, filter),
      };
    }
    const db = { apps: makeTable('apps'), messages: makeTable('messages'), appData: makeTable('appData') };

    // ===== 5. useLiveQuery（轮询）=====
    function useLiveQuery(fn, deps = [], initial) {
      const [data, setData] = useState(initial);
      useEffect(() => {
        let alive = true; let last = null;
        const run = async () => {
          try {
            const r = await fn();
            const s = JSON.stringify(r);
            if (alive && s !== last) { last = s; setData(r); }
          } catch (e) { console.warn(e); }
        };
        run();
        const t = setInterval(run, 450);
        return () => { alive = false; clearInterval(t); };
      }, deps);
      return data;
    }

    // ===== 6. 意图解析 =====
    function extractJSON(text) {
      const s = text.replace(/```(?:json)?/gi, '').replace(/```/g, '');
      const a = s.indexOf('{'); const b = s.lastIndexOf('}');
      if (a < 0 || b <= a) throw new Error('模型未返回有效 JSON');
      return JSON.parse(s.slice(a, b + 1));
    }
    async function parseIntentWithLLM(input, hasApp) {
      const system = `你是应用生成智能体。用户用自然语言描述想要的应用，你判断意图并输出严格 JSON。

可选模板：
- AIWriter: AI 写作助手（适合写作、笔记整理、文案、总结类）
- AICoder: AI 代码助手（适合代码、脚本、配置类）
- ChatAssistant: AI 问答助手（适合问答、咨询、陪聊、知识管理类）

主题色：blue, purple, green, red, orange, pink

只输出 JSON：

创建：
{"action":"create","template":"AIWriter","name":"AI 写作助手","config":{"theme":"purple","welcome":"输入主题"},"replySteps":["步骤1","步骤2"]}

改主题：
{"action":"updateTheme","config":{"theme":"red"},"replySteps":["已切换"]}

加功能：
{"action":"toggleFeature","config":{"feature":"export"},"replySteps":["已添加"]}

无法理解：
{"action":"unknown","replySteps":["提示"]}

当前有激活应用：${hasApp ? '是' : '否'}`;
      const raw = await callLLM([{ role: 'system', content: system }, { role: 'user', content: input }], 0.3);
      return extractJSON(raw);
    }

    // ===== 7. 主题映射 =====
    const THEME_BG = { blue: 'bg-blue-50', purple: 'bg-purple-50', green: 'bg-green-50', red: 'bg-red-50', orange: 'bg-orange-50', pink: 'bg-pink-50' };
    const THEME_BTN = { blue: 'bg-blue-500', purple: 'bg-purple-500', green: 'bg-green-500', red: 'bg-red-500', orange: 'bg-orange-500', pink: 'bg-pink-500' };
    const TEMPLATES = ['AIWriter', 'AICoder', 'ChatAssistant'];

    function downloadText(filename, text) {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ===== 8. 模板组件 =====
    // 写作/代码两个模板结构相同，用一个生成器组件复用
    function GeneratorApp({ app, type, title, placeholder, systemPrompt, mono, ext }) {
      const theme = app.config?.theme || 'blue';
      const features = app.config?.features || [];
      const [input, setInput] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const items = useLiveQuery(() => db.appData.where({ appId: app.id, type }).reverse().sortBy('createdAt'), [app.id], []);

      const generate = async () => {
        const topic = input.trim();
        if (!topic || busy) return;
        setBusy(true); setErr('');
        try {
          const out = await callLLM([{ role: 'system', content: systemPrompt }, { role: 'user', content: topic }]);
          await db.appData.add({ appId: app.id, type, content: JSON.stringify({ topic, text: out }) });
          setInput('');
        } catch (e) { setErr('出错了：' + e.message); }
        finally { setBusy(false); }
      };
      const exportAll = () => {
        const body = items.map((it) => { const c = JSON.parse(it.content); return `## ${c.topic}\n\n${c.text}`; }).join('\n\n---\n\n');
        downloadText(`${app.name}.${ext}`, body || '暂无内容');
      };

      return (
        <div className={`h-full flex flex-col ${THEME_BG[theme]}`}>
          <div className="flex items-center justify-between px-4 py-3 border-b bg-white">
            <div className="font-semibold">{title}</div>
            {features.includes('export') && (
              <button className={`px-3 py-2 rounded text-sm text-white ${THEME_BTN[theme]}`} onClick={exportAll}>⬇ 导出</button>
            )}
          </div>
          <div className="p-4 flex gap-2">
            <input className="flex-1 px-3 py-2 rounded border bg-white outline-none text-sm" value={input} placeholder={placeholder || app.config?.welcome}
              onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && generate()} />
            <button className={`px-4 py-2 rounded text-sm text-white ${THEME_BTN[theme]} disabled:opacity-50`} disabled={busy || !input.trim()} onClick={generate}>
              {busy ? '生成中…' : '生成'}
            </button>
          </div>
          {err && <div className="px-4 text-sm text-red-500">{err}</div>}
          <div className="flex-1 overflow-y-auto px-4 pb-4 space-y-3">
            {items.length === 0 && <div className="text-center text-sm text-gray-400 mt-8">{app.config?.welcome || '还没有内容'}</div>}
            {items.map((it) => {
              const c = JSON.parse(it.content);
              return (
                <div key={it.id} className="bg-white rounded-lg shadow p-4">
                  <div className="text-xs text-gray-500 mb-2">📝 {c.topic} · {new Date(it.createdAt).toLocaleString()}</div>
                  <div className={`text-sm whitespace-pre-wrap ${mono ? 'font-mono bg-gray-900 text-gray-100 rounded p-3' : 'text-gray-800'}`}>{c.text}</div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const AIWriter = ({ app }) => (
      <GeneratorApp app={app} type="article" title={'✍️ ' + app.name} ext="md"
        systemPrompt="你是专业写作助手。根据用户给出的主题，用 Markdown 写一篇结构清晰的中文文章，包含标题、小标题和正文。" />
    );
    const AICoder = ({ app }) => (
      <GeneratorApp app={app} type="code" title={'💻 ' + app.name} ext="txt" mono
        systemPrompt="你是资深工程师。根据用户需求直接输出可用的代码，必要时附简短注释，不要多余解释。" />
    );

    function ChatAssistant({ app }) {
      const theme = app.config?.theme || 'blue';
      const features = app.config?.features || [];
      const [input, setInput] = useState('');
      const [busy, setBusy] = useState(false);
      const endRef = useRef(null);
      const msgs = useLiveQuery(() => db.appData.where({ appId: app.id, type: 'message' }).sortBy('createdAt'), [app.id], []);
      useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs.length, busy]);

      const send = async () => {
        const text = input.trim();
        if (!text || busy) return;
        setInput(''); setBusy(true);
        await db.appData.add({ appId: app.id, type: 'message', content: JSON.stringify({ role: 'user', text }) });
        const history = msgs.map((m) => { const c = JSON.parse(m.content); return { role: c.role, content: c.text }; });
        try {
          const out = await callLLM([{ role: 'system', content: '你是友好、专业的中文问答助手。' }, ...history.slice(-10), { role: 'user', content: text }]);
          await db.appData.add({ appId: app.id, type: 'message', content: JSON.stringify({ role: 'assistant', text: out }) });
        } catch (e) {
          await db.appData.add({ appId: app.id, type: 'message', content: JSON.stringify({ role: 'assistant', text: '出错了：' + e.message }) });
        } finally { setBusy(false); }
      };
      const exportChat = () => downloadText(`${app.name}.txt`, msgs.map((m) => { const c = JSON.parse(m.content); return `${c.role === 'user' ? '我' : 'AI'}：${c.text}`; }).join('\n\n'));

      return (
        <div className={`h-full flex flex-col ${THEME_BG[theme]}`}>
          <div className="flex items-center justify-between px-4 py-3 border-b bg-white">
            <div className="font-semibold">💬 {app.name}</div>
            <div className="flex gap-2">
              {features.includes('export') && <button className={`px-3 py-2 rounded text-sm text-white ${THEME_BTN[theme]}`} onClick={exportChat}>⬇ 导出</button>}
              <button className="px-3 py-2 rounded text-sm border bg-white hover:bg-gray-100" onClick={() => db.appData.where({ appId: app.id, type: 'message' }).delete()}>清空</button>
            </div>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {msgs.length === 0 && <div className="text-center text-sm text-gray-400 mt-8">{app.config?.welcome || '开始对话吧'}</div>}
            {msgs.map((m) => {
              const c = JSON.parse(m.content);
              const mine = c.role === 'user';
              return (
                <div key={m.id} className={`flex ${mine ? 'justify-end' : ''}`}>
                  <div className={`max-w-[80%] px-3 py-2 rounded-lg text-sm whitespace-pre-wrap ${mine ? THEME_BTN[theme] + ' text-white' : 'bg-white shadow text-gray-800'}`}>{c.text}</div>
                </div>
              );
            })}
            {busy && <div className="text-xs text-gray-400">AI 正在回复…</div>}
            <div ref={endRef} />
          </div>
          <div className="p-3 border-t bg-white flex gap-2">
            <input className="flex-1 px-3 py-2 rounded border outline-none text-sm" value={input} placeholder="输入问题，回车发送"
              onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} />
            <button className={`px-4 py-2 rounded text-sm text-white ${THEME_BTN[theme]} disabled:opacity-50`} disabled={busy || !input.trim()} onClick={send}>发送</button>
          </div>
        </div>
      );
    }
    const TEMPLATE_MAP = { AIWriter, AICoder, ChatAssistant };

    // ===== 9. ChatPanel =====
    const PRESETS = ['做一个 AI 写作助手', '做一个 AI 代码助手', '做一个 AI 问答助手', '做一个管理读书笔记的应用'];
    function ChatPanel({ messages, onSend, busy, waitingLLM }) {
      const [input, setInput] = useState('');
      const endRef = useRef(null);
      useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages.length, busy]);
      const submit = () => { const t = input.trim(); if (!t || busy) return; setInput(''); onSend(t); };
      return (
        <div className="w-96 flex-shrink-0 flex flex-col border-r bg-white">
          <div className="px-4 py-3 border-b font-semibold">⚛️ Atoms 工作区</div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {messages.length === 0 && (
              <div className="mt-8">
                <div className="text-sm text-gray-500 text-center mb-2">用一句话描述你想要的应用</div>
                <div className="grid grid-cols-2 gap-2">
                  {PRESETS.map((p) => (
                    <button key={p} className="p-3 rounded-lg border text-sm text-left text-gray-700 hover:bg-gray-100" onClick={() => setInput(p)}>{p}</button>
                  ))}
                </div>
              </div>
            )}
            {messages.map((m) => (
              <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : ''}`}>
                <div className={`max-w-[85%] px-3 py-2 rounded-lg text-sm whitespace-pre-wrap ${m.role === 'user' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-800'}`}>
                  {m.role === 'assistant' && '🤖 '}{m.content}
                </div>
              </div>
            ))}
            {waitingLLM && <div className="text-sm text-gray-500">🤔 智能体思考中（约 3-8 秒）...</div>}
            <div ref={endRef} />
          </div>
          <div className="p-3 border-t flex gap-2">
            <input className="flex-1 px-3 py-2 rounded border outline-none text-sm" value={input} placeholder="描述应用，或说「换个红色主题」"
              onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submit()} />
            <button aria-label="发送" className="px-3 py-2 rounded bg-blue-500 text-white disabled:opacity-50" disabled={busy || !input.trim()} onClick={submit}>➤</button>
          </div>
        </div>
      );
    }

    // ===== 10. PreviewPanel =====
    function PreviewPanel({ app }) {
      const Tpl = app ? TEMPLATE_MAP[app.template] : null;
      return (
        <div className="flex-1 flex flex-col bg-gray-100 p-4">
          <div className="flex-1 flex flex-col bg-white rounded-lg shadow overflow-hidden border">
            <div className="flex items-center gap-2 px-3 py-2 border-b bg-gray-50">
              <span className="dot bg-red-500"></span><span className="dot bg-orange-500"></span><span className="dot bg-green-500"></span>
              <span className="ml-2 text-xs text-gray-500 truncate">{app ? app.name : '预览'}</span>
            </div>
            <div className="flex-1 overflow-hidden">
              {Tpl ? <Tpl key={app.id} app={app} /> : (
                <div className="h-full flex items-center justify-center text-sm text-gray-400">左侧描述你的应用，这里会实时预览</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ===== 11. AppSidebar =====
    function AppSidebar({ apps, activeId, onSelect, onDelete }) {
      return (
        <div className="w-56 flex-shrink-0 flex flex-col border-r bg-gray-50">
          <div className="px-4 py-3 text-xs uppercase text-gray-500 font-semibold">我的应用</div>
          <div className="flex-1 overflow-y-auto px-2 space-y-1">
            {apps.length === 0 && <div className="px-2 py-2 text-sm text-gray-400">还没有应用</div>}
            {apps.map((a) => (
              <div key={a.id} onClick={() => onSelect(a.id)}
                className={`group flex items-center justify-between px-3 py-2 rounded text-sm cursor-pointer ${a.id === activeId ? 'bg-blue-100 text-blue-700 font-medium' : 'text-gray-700 hover:bg-gray-100'}`}>
                <span className="truncate">{a.name}</span>
                <button aria-label={`删除 ${a.name}`} className="opacity-0 group-hover:opacity-100 text-gray-400 text-xs p-1.5"
                  onClick={(e) => { e.stopPropagation(); onDelete(a.id); }}>✕</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ===== 12. Workspace 主编排 =====
    function Workspace() {
      const [activeId, setActiveIdState] = useState(() => Number(localStorage.getItem('atoms_active')) || null);
      const [busy, setBusy] = useState(false);
      const [waitingLLM, setWaitingLLM] = useState(false);
      const apps = useLiveQuery(() => db.apps.all(), [], []);
      const messages = useLiveQuery(() => db.messages.where({ appId: activeId }).sortBy('createdAt'), [activeId], []);
      const activeApp = apps.find((a) => a.id === activeId) || null;

      const setActiveId = (id) => { setActiveIdState(id); localStorage.setItem('atoms_active', id || ''); };

      const handleSend = async (text) => {
        setBusy(true);
        const hasApp = !!activeApp;
        const userMsgId = await db.messages.add({ appId: activeId, role: 'user', content: text });
        let targetId = activeId;
        try {
          let intent = tryLocalRule(text, hasApp);
          if (!intent) {
            setWaitingLLM(true);
            intent = await parseIntentWithLLM(text, hasApp);
          }
          const steps = Array.isArray(intent.replySteps) && intent.replySteps.length ? intent.replySteps : ['好的。'];
          if (intent.action === 'create') {
            const template = TEMPLATES.includes(intent.template) ? intent.template : 'ChatAssistant';
            const cfg = intent.config || {};
            const newId = await db.apps.add({
              name: intent.name || 'AI 应用', template,
              config: { theme: THEME_BTN[cfg.theme] ? cfg.theme : 'blue', welcome: cfg.welcome || '', features: [] },
            });
            await db.messages.update(userMsgId, { appId: newId });
            targetId = newId;
            setActiveId(newId);
          } else if (intent.action === 'updateTheme' && hasApp) {
            const theme = intent.config?.theme;
            if (THEME_BTN[theme]) await db.apps.update(activeApp.id, { config: { ...activeApp.config, theme } });
          } else if (intent.action === 'toggleFeature' && hasApp) {
            const f = intent.config?.feature || 'export';
            const fs = activeApp.config.features || [];
            if (!fs.includes(f)) await db.apps.update(activeApp.id, { config: { ...activeApp.config, features: [...fs, f] } });
          } else if (intent.action !== 'unknown' && !hasApp) {
            steps.splice(0, steps.length, '请先创建一个应用，再修改主题或功能。');
          }
          for (const s of steps) await db.messages.add({ appId: targetId, role: 'assistant', content: s });
        } catch (e) {
          await db.messages.add({ appId: targetId, role: 'assistant', content: '出错了：' + e.message });
        } finally {
          setWaitingLLM(false); setBusy(false);
        }
      };

      const handleDelete = async (id) => {
        await db.apps.delete(id);
        await db.messages.deleteWhere({ appId: id });
        await db.appData.deleteWhere({ appId: id });
        if (id === activeId) setActiveId(null);
      };

      return (
        <div className="flex h-screen overflow-hidden">
          <AppSidebar apps={apps} activeId={activeId} onSelect={setActiveId} onDelete={handleDelete} />
          <ChatPanel messages={messages} onSend={handleSend} busy={busy} waitingLLM={waitingLLM} />
          <PreviewPanel app={activeApp} />
        </div>
      );
    }

    // ===== 13. 挂载 =====
    ReactDOM.createRoot(document.getElementById('root')).render(<Workspace />);
  </script>
</body>
</html>
